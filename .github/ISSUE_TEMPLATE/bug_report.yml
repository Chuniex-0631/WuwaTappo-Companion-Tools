name: Bug report
description: 报告计数、识别、领取或界面问题
title: "[Bug] "
labels: [bug]
body:
  - type: dropdown
    id: app
    attributes:
      label: 程序
      options:
        - WuwaTappoToolkit
        - WuwaTappoAutoPilot
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: 例如 1.3.1 或 0.2.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows 与 DPI
      placeholder: Windows 11 24H2，125%
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请同时说明上、下宝箱当时的状态。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除截图和日志中的个人信息。
          required: true
